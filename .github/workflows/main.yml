name: Docker Build & Push

on:
  push:
    branches:
      - lines-admin
      - lines-responsive
env:
  IMAGE_NAME: triplines/trip-line-admin
  PROJECT_LABEL: Trip Line Admin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build vars
        id: vars
        run: |
          echo "tag=$(date -u +'%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Notify pipeline started
        run: |
          MESSAGE=$(printf '🚀 %s Build Started\n\n👤 Triggered by: %s\n🌿 Branch: %s\n🔗 Commit: %s\n📋 Actions: %s/%s/actions/runs/%s' \
            "$PROJECT_LABEL" "${{ github.actor }}" "${{ github.ref_name }}" \
            "${{ steps.vars.outputs.commit_msg }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
      - name: Notify success
        if: success()
        run: |
          DURATION_SECS=$(( $(date +%s) - ${{ steps.vars.outputs.start }} ))
          DURATION=$(printf '%dm %02ds' $((DURATION_SECS/60)) $((DURATION_SECS%60)))
          MESSAGE=$(printf '✅ %s Build Success\n\n👤 Built by: %s\n🌿 Branch: %s\n🔗 Commit: %s\n📦 Image Tag: %s:%s\n⏱️ Duration: %s\n📋 Actions: %s/%s/actions/runs/%s' \
            "$PROJECT_LABEL" "${{ github.actor }}" "${{ github.ref_name }}" \
            "${{ steps.vars.outputs.commit_msg }}" "$IMAGE_NAME" "${{ steps.vars.outputs.tag }}" \
            "$DURATION" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE"
      - name: Notify failure
        if: failure()
        run: |
          DURATION_SECS=$(( $(date +%s) - ${{ steps.vars.outputs.start }} ))
          DURATION=$(printf '%dm %02ds' $((DURATION_SECS/60)) $((DURATION_SECS%60)))
          MESSAGE=$(printf '❌ %s Build Failed\n\n👤 Triggered by: %s\n🌿 Branch: %s\n🔗 Commit: %s\n⏱️ Duration: %s\n📋 Actions: %s/%s/actions/runs/%s' \
            "$PROJECT_LABEL" "${{ github.actor }}" "${{ github.ref_name }}" \
            "${{ steps.vars.outputs.commit_msg }}" "$DURATION" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE"
