<div>
  <!-- ═══════ LABEL ═══════ -->
  @if (label()) {
    <label [for]="inputId()" class="mb-1 block text-xs font-medium text-muted" [class]="labelClass()">
      {{ label() }}
      <ng-content select="[label-hint]" />
    </label>
  }

  <!-- ═══════ TEXTAREA or INPUT ═══════ -->
  @if (isTextarea()) {
    <textarea
      #textareaEl
      [id]="inputId()"
      [value]="getFieldValue()"
      [placeholder]="placeholder()"
      [rows]="rows()"
      [class]="classes()"
      (input)="onInputChange($event)"
      (blur)="onFieldBlur()"
    ></textarea>
  } @else {
    <div class="relative">
      <input
        #inputEl
        [id]="inputId()"
        [type]="type()"
        [value]="getFieldValue()"
        [placeholder]="placeholder()"
        [attr.step]="step() || null"
        [class]="classes()"
        (input)="onInputChange($event)"
        (blur)="onFieldBlur()"
      />

      <!-- ═══════ CUSTOM SPIN BUTTONS ═══════ -->
      @if (showCustomSpinners()) {
        <div
          class="absolute inset-y-0 end-0 flex flex-col border-s border-card-border"
          aria-hidden="true"
        >
          <button
            type="button"
            tabindex="-1"
            (click)="increment()"
            class="flex flex-1 items-center justify-center px-1.5 text-muted transition-colors hover:bg-hover hover:text-body active:bg-selected"
            aria-label="Increment"
            i18n-aria-label="@@shared.input.increment"
          >
            <app-icon name="chevron-up" size="xs" />
          </button>
          <div class="border-t border-card-border"></div>
          <button
            type="button"
            tabindex="-1"
            (click)="decrement()"
            class="flex flex-1 items-center justify-center px-1.5 text-muted transition-colors hover:bg-hover hover:text-body active:bg-selected"
            aria-label="Decrement"
            i18n-aria-label="@@shared.input.decrement"
          >
            <app-icon name="chevron-down" size="xs" />
          </button>
        </div>
      }
    </div>
  }

  <!-- ═══════ HINT TEXT ═══════ -->
  @if (hint()) {
    <p class="mt-1 text-xs text-muted">{{ hint() }}</p>
  }

  <!-- ═══════ CUSTOM CONTENT (e.g. disabled reason) ═══════ -->
  <ng-content />

  <!-- ═══════ VALIDATION ERRORS ═══════ -->
  @if (touched() && invalid()) {
    <ul role="alert" class="mt-1 text-xs text-danger">
      @for (err of errors(); track $index) {
        <li>{{ err.message }}</li>
      }
    </ul>
  }
</div>
