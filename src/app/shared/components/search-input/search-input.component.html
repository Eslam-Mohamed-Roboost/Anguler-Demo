<div class="relative">
  <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-light">
    <app-icon name="search" size="sm" />
  </span>

  <input
    type="text"
    [value]="query()"
    (input)="onInput($event)"
    [placeholder]="placeholder()"
    class="w-full rounded-lg border border-card-border bg-input-bg py-2 pl-10 pr-9 text-sm text-body placeholder:text-muted transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-focus-ring"
    aria-label="Search"
    i18n-aria-label="@@shared.search.label"
  />

  @if (query()) {
    <button
      type="button"
      (click)="clear()"
      class="absolute right-2.5 top-1/2 -translate-y-1/2 rounded-full p-0.5 text-muted transition hover:bg-hover hover:text-body"
      aria-label="Clear search"
      i18n-aria-label="@@shared.search.clear"
    >
      <app-icon name="close" size="xs" />
    </button>
  }
</div>
