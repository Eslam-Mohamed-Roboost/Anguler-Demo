<app-modal [open]="isOpen()" [title]="title()" (closed)="dialog.cancel()">
  <p class="text-sm text-body-soft">{{ message() }}</p>

  <div modal-footer class="flex justify-end gap-2 border-t border-divider bg-input-bg px-4 py-3">
    <app-btn variant="secondary" size="sm" (click)="dialog.cancel()">
      {{ cancelLabel() }}
    </app-btn>
    <app-btn [variant]="confirmVariant()" size="sm" (click)="dialog.accept()">
      {{ confirmLabel() }}
    </app-btn>
  </div>
</app-modal>
