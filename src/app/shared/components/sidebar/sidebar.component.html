<!-- ═══════ MOBILE OVERLAY SIDEBAR (animated) ═══════ -->
@if (open()) {
  <div @sidebarAnimation class="fixed inset-0 z-40 lg:hidden">
    <!-- Backdrop -->
    <div
      class="sidebar-backdrop absolute inset-0 bg-overlay"
      (click)="closed.emit()"
      aria-hidden="true"
    ></div>

    <!-- Mobile sidebar panel -->
    <aside class="sidebar-panel relative z-50 flex h-full w-64 flex-col border-r border-divider bg-panel text-body">
      <div class="flex h-16 items-center gap-2 border-b border-divider px-4">
        <app-icon name="package" size="lg" />
        <span class="text-lg font-bold">Angular Demo</span>
      </div>
      <nav class="flex-1 space-y-1 p-4" aria-label="Main navigation">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-selected text-blue"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="closed.emit()"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-body-soft transition-colors hover:bg-hover"
          >
            <app-icon [name]="link.icon" size="sm" />
            {{ link.label }}
          </a>
        }
      </nav>
    </aside>
  </div>
}

<!-- ═══════ DESKTOP SIDEBAR (always visible on lg+) ═══════ -->
<aside class="hidden w-64 flex-col border-r border-divider bg-panel text-body lg:flex">
  <div class="flex h-16 items-center gap-2 border-b border-divider px-4">
    <app-icon name="package" size="lg" />
    <span class="text-lg font-bold">Angular Demo</span>
  </div>
  <nav class="flex-1 space-y-1 p-4" aria-label="Main navigation">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="bg-selected text-blue"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-body-soft transition-colors hover:bg-hover"
      >
        <app-icon [name]="link.icon" size="sm" />
        {{ link.label }}
      </a>
    }
  </nav>
</aside>
