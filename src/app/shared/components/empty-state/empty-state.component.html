<div @fadeSlideIn class="flex flex-col items-center justify-center py-12 text-center">
  @if (icon()) {
    <div class="mb-4 rounded-full bg-input-bg p-4 text-muted">
      <app-icon [name]="$any(icon())" size="lg" />
    </div>
  }

  @if (title()) {
    <h3 class="mb-1 text-lg font-semibold text-body">
      {{ title() }}
    </h3>
  }

  @if (description()) {
    <p class="mb-4 max-w-sm text-sm text-muted">
      {{ description() }}
    </p>
  }

  <!-- Action slot (e.g. a button) -->
  <ng-content />
</div>
