<div class="flex h-dvh min-h-0 overflow-hidden bg-gray-50 dark:bg-gray-900">
  <!-- Sidebar -->
  @if (navbarStyle() === 'default') {
    <app-sidebar [open]="sidebarOpen()" (closed)="closeSidebar()" />
  }

  <!-- Main content area -->
  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <!-- Conditional navbar -->
    @if (navbarStyle() === 'default') {
      <app-navbar (menuToggle)="toggleSidebar()" />
    } @else if (navbarStyle() === 'booking') {
      <app-navbar-booking
        signInText="Sign In"
        joinUsText="Join Us Now"
        [isAuthenticated]="isAuthenticated()"
        (joinUsClick)="onJoinUsClick()"
        (signInClick)="onSignInClick()"
      />
    }

    <!-- Main content -->
    @if (navbarStyle() === 'booking') {
      <div class="min-h-0 min-w-0 flex-1 overflow-hidden font-sans">
        @if (routeOutletVisible()) {
          <router-outlet />
        }
      </div>
    } @else {
      <main id="main-content" class="min-h-0 min-w-0 flex-1 overflow-y-auto overflow-x-hidden" @routeAnimation>
        @if (routeOutletVisible()) {
          <router-outlet />
        }
      </main>
    }
  </div>
</div>
