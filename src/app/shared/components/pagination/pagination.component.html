@if (totalPages() > 1) {
  <nav
    class="mt-4 flex max-w-full flex-wrap items-center justify-center gap-1 overflow-x-auto pt-4 text-sm"
    [attr.aria-label]="'shared.pagination.label' | translate"
  >
    <!-- Previous -->
    <button
      type="button"
      (click)="goToPage(currentPage() - 1)"
      [disabled]="!hasPrev()"
      class="flex size-8 shrink-0 items-center justify-center rounded-full text-muted transition hover:bg-hover hover:text-body disabled:cursor-not-allowed disabled:opacity-30 sm:size-9"
      [attr.aria-label]="'shared.pagination.prev' | translate"
    >
      <app-icon name="chevron-left" size="sm" />
    </button>

    <!-- Page numbers + ellipsis -->
    @for (item of pages(); track $index) {
      @if (item === '...') {
        <span class="flex size-8 shrink-0 items-center justify-center text-gray-400 select-none sm:size-9">…</span>
      } @else {
        <button
          type="button"
          (click)="goToPage(item)"
          class="flex size-8 shrink-0 items-center justify-center rounded-full text-sm font-medium transition-colors sm:size-9"
          [class]="item === currentPage()
            ? 'bg-primary text-white shadow-sm'
            : 'text-muted hover:bg-hover hover:text-body'"
          [attr.aria-current]="item === currentPage() ? ('shared.pagination.current' | translate) : null"
        >
          {{ item }}
        </button>
      }
    }

    <!-- Next -->
    <button
      type="button"
      (click)="goToPage(currentPage() + 1)"
      [disabled]="!hasNext()"
      class="flex size-8 shrink-0 items-center justify-center rounded-full text-muted transition hover:bg-hover hover:text-body disabled:cursor-not-allowed disabled:opacity-30 sm:size-9"
      [attr.aria-label]="'shared.pagination.next' | translate"
    >
      <app-icon name="chevron-right" size="sm" />
    </button>
  </nav>
}
