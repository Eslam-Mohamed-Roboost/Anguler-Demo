<header class="flex h-16 items-center justify-between border-b border-divider bg-panel px-4 text-body">
  <!-- Left side: mobile menu + breadcrumbs -->
  <div class="flex items-center gap-4">
    <button
      type="button"
      (click)="menuToggle.emit()"
      class="rounded p-1.5 text-muted transition-colors hover:bg-hover lg:hidden"
      aria-label="Toggle sidebar"
      i18n-aria-label="@@nav.toggleSidebar"
    >
      <app-icon name="menu" />
    </button>
    <app-breadcrumb />
  </div>

  <!-- Right side: nav icons + theme toggle + auth -->
  <div class="flex items-center gap-3">
    <!-- Message and Notification Icons -->
    @if (showNavIcons()) {
      <!-- Messages -->
      <button
        type="button"
        (click)="onMessageClick()"
        class="relative rounded p-1.5 text-muted transition-colors hover:bg-hover"
        [appTooltip]="'Messages'"
        aria-label="Messages"
      >
        <app-icon name="chat-bubble" size="sm" />
        @if (messageCount() > 0) {
            <span class="absolute -right-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full bg-danger text-xs font-medium text-white">
            {{ messageCount() > 99 ? '99+' : messageCount() }}
          </span>
        }
      </button>

      <!-- Notifications -->
      <button
        type="button"
        (click)="onNotificationClick()"
        class="relative rounded p-1.5 text-muted transition-colors hover:bg-hover"
        [appTooltip]="'Notifications'"
        aria-label="Notifications"
      >
        <app-icon name="alert-triangle" size="sm" />
        @if (notificationCount() > 0) {
            <span class="absolute -right-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full bg-danger text-xs font-medium text-white">
            {{ notificationCount() > 99 ? '99+' : notificationCount() }}
          </span>
        }
      </button>
    }

    <!-- Theme toggle -->
    <button
      type="button"
      (click)="themeService.toggleTheme()"
      class="flex size-9 shrink-0 items-center justify-center rounded-full border bg-panel text-primary transition focus:outline-none focus:ring-2 focus:ring-focus-ring focus:ring-offset-2 focus:ring-offset-page-bg sm:size-10"
      [class]="themeSwitchClass()"
      [appTooltip]="themeService.themeTooltip()"
      aria-label="Toggle theme"
      i18n-aria-label="@@nav.toggleTheme"
    >
      <app-icon class="size-full" [name]="themeService.themeIcon()" size="full" />
    </button>

    <!-- Auth info -->
    @if (authService.isAuthenticated()) {
      <span class="hidden text-sm text-body-soft sm:block">
        {{ hotelName() || authService.userName() }}
      </span>
      <button
        type="button"
        (click)="authService.logout()"
        class="rounded p-1.5 text-muted transition-colors hover:bg-hover"
        [appTooltip]="'Log out'"
        aria-label="Log out"
        i18n-aria-label="@@nav.logout"
      >
        <app-icon name="log-out" size="sm" />
      </button>
    } @else {
      <button
        type="button"
        (click)="mockLogin()"
        class="inline-flex items-center gap-1.5 rounded bg-blue px-3 py-1.5 text-xs font-medium text-white transition-colors hover:brightness-95"
      >
        <app-icon name="log-in" size="xs" />
        <span i18n="@@nav.login">Log in</span>
      </button>
    }
  </div>
</header>

<!-- Billing Panel -->
<app-billing-panel 
  [isOpen]="billingPanelOpen()"
  [billingItems]="billingItems()"
  (closePanel)="onCloseBillingPanel()"
 
/>
