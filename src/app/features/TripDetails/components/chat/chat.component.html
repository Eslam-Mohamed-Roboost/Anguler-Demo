<section class="flex h-full min-h-0 w-full min-w-0 flex-col overflow-hidden rounded-xl border border-card-border bg-panel shadow-sm">
  <!-- Header -->
  <div class="shrink-0 border-b border-divider px-4 py-3 sm:px-5">
    <h3 class="flex min-w-0 flex-wrap items-center gap-2 text-base font-bold text-primary-text sm:text-lg">
      <span class="text-primary">
        <app-icon name="chat-bubble" size="sm" />
      </span>
      {{ 'tripDetails.chatConversation' | translate }}
      @if (conversation()?.status) {
        <span class="rounded-full px-2 py-0.5 text-xs font-medium"
          [class]="conversation()?.status === 'Open' ? 'bg-status-active-bg text-status-active' : 'bg-input-bg text-muted'">
          {{ conversationStatusKey() | translate }}
        </span>
      }
    </h3>
  </div>

  <!-- Messages -->
  <div #messagesContainer class="chat-messages min-h-0 flex-1 overflow-y-auto px-4 py-4 sm:px-6 md:px-8 lg:px-10 xl:px-12">
    @if (chatLoading()) {
      <div class="flex h-full items-center justify-center">
        <span class="size-6 animate-spin rounded-full border-4 border-card-border border-t-primary block"></span>
      </div>
    } @else {
      <app-message
        [messages]="conversation()?.messages ?? []"
        [currentUserRole]="currentUserRole()"
        [currentUserId]="currentUserId()"
      />
    }
  </div>

  <!-- Input -->
  <div class="chat-input shrink-0 border-t border-divider bg-panel px-4 py-3 sm:px-6 md:px-8 lg:px-10 xl:px-12">
    <app-chat-input [loading]="sendLoading()" (send)="onSend($event)" />
  </div>
</section>
