<section class="flex min-h-0 h-full w-full min-w-0 flex-1 flex-col overflow-hidden bg-white dark:bg-gray-800">
  <!-- Header -->
  <div class="shrink-0 px-4 py-3 sm:px-6">
    <h3 class="flex items-center gap-2 text-base font-bold text-primary-text sm:text-lg">
      <span class="text-primary">
        <app-icon name="chat-bubble" size="sm" />
      </span>
      {{ 'tripDetails.chatConversation' | translate }}
      @if (conversation()?.status) {
        <span class="rounded-full px-2 py-0.5 text-xs font-medium"
          [class]="conversation()?.status === 'Open' ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-500'">
          {{ conversationStatusKey() | translate }}
        </span>
      }
    </h3>
  </div>

  <!-- Messages -->
  <div #messagesContainer class="chat-messages min-h-0 flex-1 overflow-y-scroll px-4 py-6 sm:px-10 md:px-20 lg:px-28 xl:px-32">
    @if (chatLoading()) {
      <div class="flex h-full items-center justify-center">
        <span class="size-6 animate-spin rounded-full border-4 border-gray-200 border-t-primary block"></span>
      </div>
    } @else {
      <app-message
        [messages]="conversation()?.messages ?? []"
        [currentUserRole]="currentUserRole()"
        [currentUserId]="currentUserId()"
      />
    }
  </div>

  <!-- Input -->
  <div class="chat-input shrink-0 bg-white px-4 py-3 dark:bg-gray-800 sm:px-10 md:px-20 lg:px-28 xl:px-32">
    <app-chat-input [loading]="sendLoading()" (send)="onSend($event)" />
  </div>
</section>
