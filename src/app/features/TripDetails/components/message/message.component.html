<div class="flex flex-col gap-10" dir="ltr">
  @for (msg of messages(); track msg.id) {
    @if (isMine(msg)) {
      <!-- RIGHT MESSAGE (Current user) -->
      <div class="message-row message-row--mine flex w-fit max-w-[85%] flex-col items-end sm:max-w-[52%]">
        <div class="mb-1.5 flex items-center gap-1.5">
          <span class="text-[11px] font-bold text-[#607089]" dir="auto">{{ roleLabelKey(msg.senderRole) | translate }}</span>
          <span class="flex size-4 items-center justify-center rounded-full bg-[#8AA0C2] text-white">
            <app-icon name="user" size="xs" class="text-white" />
          </span>
        </div>
        <div class="max-w-full rounded-[22px] rounded-br-sm bg-[#00a63e] px-6 py-4 text-sm leading-relaxed text-white shadow-sm" dir="auto">
          {{ msg.message }}
        </div>
        <span class="mt-1.5 text-xs text-[#A9B8D3]" dir="ltr">{{ formatDateTime(msg.createdAt) }}</span>
      </div>
    } @else {
      <!-- LEFT MESSAGE (Other user) -->
      <div class="message-row message-row--other flex w-fit max-w-[85%] flex-col items-start sm:max-w-[52%]">
        <div class="mb-1.5 flex items-center gap-1.5">
          <img src="assets/booking/logo-lines.png" alt="" class="size-4 rounded-full object-contain" />
          <span class="text-[11px] font-bold text-[#607089]" dir="auto">{{ roleLabelKey(msg.senderRole) | translate }}</span>
        </div>
        <div class="max-w-full rounded-[22px] rounded-bl-sm bg-[#FCFCFD] px-6 py-4 text-sm leading-relaxed text-primary-text shadow-sm dark:bg-gray-700 dark:text-gray-100" dir="auto">
          {{ msg.message }}
        </div>
        <span class="mt-1.5 text-xs text-[#A9B8D3]" dir="ltr">{{ formatDateTime(msg.createdAt) }}</span>
      </div>
    }
  }
</div>
