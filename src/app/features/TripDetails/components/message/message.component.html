<div class="flex flex-col gap-6" dir="ltr">
  @for (msg of messages(); track msg.id) {
    @if (isMine(msg)) {
      <!-- RIGHT MESSAGE (Current user) -->
      <div class="message-row message-row--mine flex w-fit max-w-[85%] flex-col items-end sm:max-w-[75%]">
        <div class="mb-1.5 flex items-center gap-2">
          <span class="text-sm font-medium text-primary-text" dir="auto">{{ roleLabelKey(msg.senderRole) | translate }}</span>
          <span class="flex size-6 items-center justify-center rounded-full bg-gray-400 text-white">
            <app-icon name="user" size="xs" class="text-white" />
          </span>
        </div>
        <div class="max-w-full rounded-2xl rounded-br-sm bg-primary px-5 py-3 text-sm text-white" dir="auto">
          {{ msg.message }}
        </div>
        <span class="mt-1 text-xs text-gray-400" dir="ltr">{{ formatDateTime(msg.createdAt) }}</span>
      </div>
    } @else {
      <!-- LEFT MESSAGE (Other user) -->
      <div class="message-row message-row--other flex w-fit max-w-[85%] flex-col items-start sm:max-w-[75%]">
        <div class="mb-1.5 flex items-center gap-2">
          <span class="flex size-6 items-center justify-center rounded bg-amber-400/80 text-amber-900">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="4" y1="6" x2="20" y2="6"/>
              <line x1="4" y1="12" x2="20" y2="12"/>
              <line x1="4" y1="18" x2="20" y2="18"/>
            </svg>
          </span>
          <span class="text-sm font-medium text-primary-text" dir="auto">{{ roleLabelKey(msg.senderRole) | translate }}</span>
        </div>
        <div class="max-w-full rounded-2xl rounded-bl-sm bg-gray-100 px-4 py-3 text-sm text-primary-text dark:bg-gray-700 dark:text-gray-100" dir="auto">
          {{ msg.message }}
        </div>
        <span class="mt-1 text-xs text-gray-400" dir="ltr">{{ formatDateTime(msg.createdAt) }}</span>
      </div>
    }
  }
</div>
