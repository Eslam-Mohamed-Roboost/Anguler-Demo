@if (loading()) {
  <div class="flex h-full items-center justify-center">
    <div class="size-8 animate-spin rounded-full border-4 border-gray-200 border-t-primary"></div>
  </div>
} @else if (error()) {
  <div class="flex h-full flex-col items-center justify-center gap-3 text-gray-500">
    <p>Failed to load trip details.</p>
  </div>
} @else if (tripData(); as data) {
  <div class="flex h-full min-h-0 flex-col gap-4 w-full sm:gap-6">
    <!-- Trip Details Card -->
    <section class="shrink-0 w-full">
      <app-details
        [passengerCard]="data.passengerCard"
        [driverCard]="data.driverCard"
        [tripDetails]="data.tripDetails"
      />
    </section>

    <!-- Chat -->
    <section class="flex min-h-[400px] min-w-0 flex-1 flex-col">
      <app-chat />
    </section>
  </div>
}
