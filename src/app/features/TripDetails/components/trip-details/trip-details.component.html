@if (loading()) {
  <!-- Skeleton mimics: details card (header + 2-col grid) + chat card -->
  <div class="trip-details-page" aria-hidden="true">
    <div class="trip-details-shell">

      <!-- Details card skeleton -->
      <section class="trip-details-card rounded-xl border border-card-border bg-panel px-4 py-4 shadow-sm">
        <!-- Header row -->
        <div class="flex items-center justify-between border-b border-divider px-1 pb-3">
          <app-skeleton-block width="160px" height="1.5rem" />
          <app-skeleton-block width="80px" height="1.75rem" />
        </div>
        <!-- 2-column field grid -->
        <div class="grid grid-cols-1 gap-4 pt-4 sm:grid-cols-2 sm:gap-5">
          @for (_ of [1,2,3,4,5,6,7,8]; track $index) {
            <div class="flex flex-col gap-2">
              <app-skeleton-block width="40%" height="0.75rem" />
              <app-skeleton-block width="70%" height="1rem" />
            </div>
          }
        </div>
      </section>

      <!-- Chat card skeleton -->
      <section class="trip-details-chat flex flex-col gap-3 rounded-xl border border-card-border bg-panel px-5 py-4 shadow-sm">
        <app-skeleton-block width="120px" height="1.25rem" />
        <div class="flex flex-1 flex-col gap-3 pt-2">
          <div class="flex justify-end"><app-skeleton-block width="55%" height="2.25rem" /></div>
          <div class="flex justify-start"><app-skeleton-block width="45%" height="2.25rem" /></div>
          <div class="flex justify-end"><app-skeleton-block width="60%" height="2.25rem" /></div>
          <div class="flex justify-start"><app-skeleton-block width="38%" height="2.25rem" /></div>
        </div>
        <!-- Input row -->
        <div class="flex items-center gap-2 border-t border-divider pt-3">
          <app-skeleton-block width="100%" height="2.5rem" />
          <app-skeleton-block width="2.5rem" height="2.5rem" />
        </div>
      </section>

    </div>
  </div>
} @else if (error()) {
  <div class="flex h-full flex-col items-center justify-center gap-3 bg-page-bg p-4 text-muted">
    <p>{{ 'tripDetails.loadError' | translate }}</p>
  </div>
} @else if (tripData(); as data) {
  <div class="trip-details-page">
    <div class="trip-details-shell">
      <!-- Trip Details Card -->
      <section class="trip-details-card">
        <app-details
          [data]="data"
          [tripRequestId]="tripRequestId()"
          [isAdmin]="isAdmin()"
          (statusChanged)="refreshTrip()"
        />
      </section>

      <!-- Chat -->
      <section class="trip-details-chat">
        <app-chat [tripRequestId]="tripRequestId()" />
      </section>
    </div>
  </div>
}
