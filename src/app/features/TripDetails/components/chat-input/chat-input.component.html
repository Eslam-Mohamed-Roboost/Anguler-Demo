<div class="flex items-center gap-3">
  <div class="relative min-w-0 flex-1">
    <span class="pointer-events-none absolute left-3 top-1/2 h-5 w-0.5 -translate-y-1/2 rounded-full bg-primary"></span>
    <input
      #messageInput
      type="text"
      placeholder="{{ 'chatInput.placeholder' | translate }}"
      class="min-w-0 w-full rounded-full border border-transparent bg-[#F8FAFF] py-3 pe-5 ps-5 text-xs text-primary-text outline-none transition placeholder:text-[#A9B8D3] focus:border-primary/40 focus:ring-2 focus:ring-primary/10 dark:bg-gray-700 dark:text-gray-100 dark:placeholder:text-gray-400"
      [attr.aria-label]="'chatInput.messageInput' | translate"
      [disabled]="loading()"
      (keydown.enter)="onSend(messageInput)"
    />
  </div>
  <button
    type="button"
    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-primary text-white transition hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 disabled:opacity-60"
    [attr.aria-label]="'chatInput.sendMessage' | translate"
    [disabled]="loading()"
    (click)="onSend(messageInput)"
  >
    @if (loading()) {
      <span class="block size-5 animate-spin rounded-full border-2 border-white/40 border-t-white" aria-hidden="true"></span>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M23.2806 2.67519C23.8548 1.08689 22.3157 -0.452233 20.7274 0.123276L1.31557 7.14369C-0.278047 7.72053 -0.470769 9.89497 0.99525 10.7443L7.19161 14.3316L12.7247 8.79844C12.9754 8.55633 13.3111 8.42236 13.6596 8.42539C14.0081 8.42842 14.3415 8.5682 14.5879 8.81463C14.8343 9.06106 14.9741 9.39442 14.9772 9.74291C14.9802 10.0914 14.8462 10.4271 14.6041 10.6778L9.07098 16.2109L12.6596 22.4073C13.5076 23.8733 15.682 23.6793 16.2589 22.087L23.2806 2.67519Z" fill="currentColor"/>
      </svg>
    }
  </button>
  <button
    type="button"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-[#607089] transition hover:bg-[#F8FAFF] hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
    [attr.aria-label]="'chatInput.attachFile' | translate"
    (click)="attach.emit()"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
    </svg>
  </button>
  <button
    type="button"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-[#607089] transition hover:bg-[#F8FAFF] hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
    [attr.aria-label]="'chatInput.addImage' | translate"
    (click)="addImage.emit()"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
