<div class="flex flex-col gap-4 w-full">
  <!-- Checkbox row -->
  <div class="flex items-center gap-2">
    <button
      type="button"
      (click)="toggleCheckbox()"
      class="flex items-center justify-center flex-shrink-0 size-4 rounded border-[0.3px] border-solid transition-colors"
      [class]="
        isChecked()
          ? 'bg-[#00a63e] border-[#00a63e]'
          : 'border-[#a9b4be] bg-white'
      "
      [attr.aria-label]="'join.additionalNote' | translate"
    >
      @if (isChecked()) {
        <svg class="size-2.5 text-white" viewBox="0 0 16 16" fill="none">
          <path
            d="M2.75 8.75l3 3 8-8"
            stroke="white"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      }
    </button>
    <label class="text-sm font-normal text-[#223548] cursor-pointer">
      {{ 'join.additionalNote' | translate }}
    </label>
  </div>

  <!-- Textarea (shown only when checked) -->
  @if (isChecked()) {
    <textarea
      (input)="onNoteChange($event)"
      [value]="noteText()"
      placeholder="write Your note here"
      class="w-full h-[69px] rounded-[12px] border-[0.3px] border-[#a9b4be] bg-[rgba(249,250,250,0.7)] px-4 py-3 text-sm text-[#223548] placeholder-[rgba(34,53,72,0.4)] resize-none focus:outline-none focus:ring-2 focus:ring-[#1b90ff]/30 focus:border-[#1b90ff]"
    ></textarea>
  }
</div>
