<app-card variant="elevated" class="mb-6">
  <div class="flex items-center gap-2.5 mb-6">
    <div class="size-7 bg-primary rounded-full flex items-center justify-center text-white shrink-0">
      <app-icon name="home" size="sm" />
    </div>
    <h3 class="text-base font-semibold text-body max-sm:text-[15px]">Hotel Details</h3>
  </div>

  <form class="flex flex-col gap-5" (submit)="handleSubmit($event)">
    <!-- Row 1: Hotel Name | Address | Email -->
    <div class="flex gap-5 items-start max-lg:flex-wrap max-md:flex-col max-md:gap-4">
      <div class="flex-1 min-w-0">
        <app-input
          label="Hotel Name"
          inputId="name"
          type="text"
          placeholder="User entered text"
          [field]="fieldTree.name"
           [disabled]="true"
        />
      </div>
      <div class="flex-1 min-w-0">
        <app-input
          label="Address"
          inputId="address"
          type="text"
          placeholder="User entered text"
          [field]="fieldTree.address"
           [disabled]="true"
        />
      </div>
      <div class="flex-1 min-w-0">
        <app-input
          label="Email"
          inputId="email"
          type="email"
          placeholder="User entered text"
          [field]="fieldTree.email"
           [disabled]="true"
        />
      </div>
    </div>

    <!-- Row 2: Phone Number | Hotel Code | Joining Date -->
    <div class="flex gap-5 items-start max-lg:flex-wrap max-md:flex-col max-md:gap-4">
      <div class="flex-1 min-w-0">
        <app-input
          label="Phone Number"
          inputId="phone"
          type="tel"
          placeholder="User entered text"
          [field]="fieldTree.phone"
           [disabled]="true"
        />
      </div>
      <div class="flex-1 min-w-0">
        <app-input
          label="Hotel Code"
          inputId="hotelCode"
          type="text"
          placeholder="User entered text"
          [field]="fieldTree.hotelCode"
           [disabled]="true"
        />
      </div>
      <div class="flex-1 min-w-0">
        <app-input
          label="Joining Date"
          inputId="joiningDate"
          type="date"
          placeholder=""
          [field]="fieldTree.joiningDate"
           [disabled]="true"
        />
      </div>
    </div>

    <!-- Form Actions -->
    <!-- <div class="flex gap-3 justify-end pt-4 border-t border-gray-100">
      <button
        type="button"
        (click)="formCancel.emit()"
        [disabled]="loading()"
        class="px-4 py-2 rounded-lg border border-card-border bg-white text-body font-medium transition hover:bg-gray-50 disabled:opacity-50"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="loading()"
        class="flex items-center gap-2 px-4 py-2 rounded-lg bg-warning text-white font-medium transition hover:brightness-90 disabled:opacity-50"
      >
        @if (loading()) {
          <span class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white block"></span>
        }
        Save Changes
      </button>
    </div> -->
  </form>
</app-card>
