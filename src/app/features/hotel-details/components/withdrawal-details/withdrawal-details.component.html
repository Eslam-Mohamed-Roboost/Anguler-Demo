<app-card variant="elevated" class="mb-6">
  <!-- Header -->
  <div class="flex items-center justify-between flex-wrap gap-3 mb-6">
    <div class="flex items-center gap-2.5">
      <div class="size-7 bg-primary rounded-full flex items-center justify-center text-white shrink-0">
        <app-icon name="bank-notes" size="sm" />
      </div>
      <h3 class="text-base font-semibold text-body max-sm:text-[15px]">Withdrawal Details</h3>
    </div>
    <div class="text-sm font-semibold text-warning max-sm:text-cell">
      Awaiting Payout: {{ amountLabel() }}
    </div>
  </div>

  <form class="flex flex-col gap-5" (submit)="handleSubmit($event)">
    <!-- Row 1: Account Holder Name | Bank Name -->
    <div class="flex gap-5 items-start max-md:flex-col max-md:gap-4">
      <div class="flex-1 min-w-0">
        <app-input
          label="Account Holder Name"
          inputId="accountHolderName"
          type="text"
          placeholder="User entered text"
          [field]="fieldTree.accountHolderName"
        />
      </div>
      <div class="flex-1 min-w-0">
        <app-input
          label="Bank Name"
          inputId="bankName"
          type="text"
          placeholder="User entered text"
          [field]="fieldTree.bankName"
        />
      </div>
    </div>

    <!-- Row 2: IBAN | Swift Code / BIC -->
    <div class="flex gap-5 items-start max-md:flex-col max-md:gap-4">
      <div class="flex-1 min-w-0">
        <app-input
          label="IBAN"
          inputId="iban"
          type="text"
          placeholder="User entered text"
          [field]="fieldTree.iban"
        />
      </div>
      <div class="flex-1 min-w-0">
        <app-input
          label="Swift Code / BIC"
          inputId="swiftCode"
          type="text"
          placeholder="User entered text"
          [field]="fieldTree.swiftCode"
        />
      </div>
    </div>

    <!-- Settle Balance Button -->
    <div class="flex justify-end mt-2">
      <button type="submit" class="bg-warning text-white rounded-btn px-6 py-2.5 text-sm font-semibold cursor-pointer hover:brightness-90 transition disabled:bg-gray-300 disabled:text-muted disabled:cursor-not-allowed border-none max-md:w-full" [disabled]="submitLoading()">
        Settle Balance : {{ amountLabel() }}
      </button>
    </div>
  </form>
</app-card>
