@if (submitted()) {
  <!-- Success state -->
  <div class="text-center lg:text-start">
    <div class="mb-4 inline-flex size-14 items-center justify-center rounded-full bg-emerald-50">
      <app-icon name="mail" size="lg" class="text-emerald-500" />
    </div>
    <h1 class="mb-2 text-3xl font-bold text-gray-800" i18n="@@auth.forgot.successTitle">Check your email</h1>
    <p class="mb-8 text-sm text-gray-400" i18n="@@auth.forgot.successSubtitle">
      We sent a password reset link to your email address. Please check your inbox.
    </p>
    <a
      routerLink="/auth/login"
      class="inline-flex items-center gap-2 text-sm font-medium text-emerald-500 transition-colors hover:text-emerald-600"
    >
      <app-icon name="chevron-left" size="sm" class="rtl:rotate-180" />
      <span i18n="@@auth.forgot.backToLogin">Back to Login</span>
    </a>
  </div>
} @else {
  <!-- Form state -->
   <div class="text-start my-2">
      <a
        routerLink="/auth/login"
        class="inline-flex items-center gap-2 text-sm font-medium text-[#223548] transition-colors hover:text-emerald-600"
      >
        <app-icon name="chevron-left" size="sm" class="rtl:rotate-180 text-warning" />
        <span i18n="@@auth.forgot.backToLogin">Back to Login</span>
      </a>
    </div>
  <h1 class="mb-1 text-3xl font-bold text-gray-800" i18n="@@auth.forgot.title">Forgot Password</h1>
  <p class="mb-8 text-sm text-gray-400" i18n="@@auth.forgot.subtitle">
    Enter your email and we'll send you a link to reset your password
  </p>

  <!-- Error message -->
  @if (errorMessage()) {
    <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600" role="alert">
      {{ errorMessage() }}
    </div>
  }

  <form  class="space-y-5">
    <!-- Email -->
    <div>
      <label for="forgot-email" class="mb-1.5 block text-sm font-medium text-gray-600" i18n="@@auth.forgot.emailLabel">Email</label>
      <input
        id="forgot-email"
        type="email"
        formControlName="email"
        i18n-placeholder="@@auth.forgot.emailPlaceholder"
        placeholder="Enter Your Email"
        [formField]="forgotForm.email"
        class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm text-gray-700 outline-none transition-colors placeholder:text-gray-300 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"
      />
        <!-- [class.border-red-400]="form.controls.email.touched && form.controls.email.invalid" -->


      <!-- @if (form.controls.email.touched && form.controls.email.hasError('required')) {
        <p class="mt-1 text-xs text-red-500" i18n="@@auth.forgot.emailRequired">Email is required</p>
      } @else if (form.controls.email.touched && form.controls.email.hasError('email')) {
        <p class="mt-1 text-xs text-red-500" i18n="@@auth.forgot.emailInvalid">Please enter a valid email</p>
      } -->
    </div>

    <!-- Submit -->
    <button
      type="button"
      [disabled]="loading()"
      (click)="onSubmit()"
      class="w-full rounded-lg bg-primary py-3 text-sm font-semibold text-white transition-colors hover:bg-emerald-600 disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (loading()) {
        <app-icon name="spinner" size="sm" class="inline-block" />
        <span class="ms-2" i18n="@@auth.forgot.sending">Sending...</span>
      } @else {
        <span i18n="@@auth.forgot.resetButton">Reset Password</span>
      }
    </button>

    <!-- Back to login -->
    <!-- <div class="text-center">
      <a
        routerLink="/auth/login"
        class="inline-flex items-center gap-2 text-sm font-medium text-emerald-500 transition-colors hover:text-emerald-600"
      >
        <app-icon name="chevron-left" size="sm" class="rtl:rotate-180" />
        <span i18n="@@auth.forgot.backToLogin">Back to Login</span>
      </a>
    </div> -->
  </form>
}
