<div class="flex flex-col items-center gap-2">   
    <div class="relative">
        <div class="w-32 h-32 rounded-full overflow-hidden">
            <img 
                [src]="imageSrc()" 
                [alt]="hotelName() + ' logo'" 
                class="w-full h-full object-cover"
            />
        </div>
        <label
            for="profile-image-upload"
            class="absolute bottom-0 right-0 cursor-pointer rounded-full bg-white"
            [class.pointer-events-none]="uploading()"
            [attr.aria-label]="'Change profile image'"
        >
            <svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 2C36.1503 2 46 11.8497 46 24C46 36.1503 36.1503 46 24 46C11.8497 46 2 36.1503 2 24C2 11.8497 11.8497 2 24 2Z" fill="#00A63E"/>
                <path d="M24 2C36.1503 2 46 11.8497 46 24C46 36.1503 36.1503 46 24 46C11.8497 46 2 36.1503 2 24C2 11.8497 11.8497 2 24 2Z" stroke="white" stroke-width="4"/>
                <path d="M19.5475 18.9752V27.2365C19.5475 30.0253 21.564 32.1182 24.4292 32.1182" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M29.3108 31.7427V23.4814C29.3108 20.6926 27.2943 18.5997 24.4292 18.5997" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M31.1884 29.8651C31.1884 29.8651 29.8056 31.7427 29.3109 31.7427C28.8161 31.7427 27.4333 29.8651 27.4333 29.8651" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21.4251 20.4775C21.4251 20.4775 20.0423 18.5999 19.5475 18.5999C19.0527 18.5999 17.6699 20.4775 17.6699 20.4775" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input
                id="profile-image-upload"
                type="file"
                accept="image/*"
                class="sr-only"
                [disabled]="uploading()"
                (change)="onImageChange($event)"
            />
        </label>
    </div>
    <h2 class="text-lg font-semibold">{{ hotelName() }}</h2>
    @if (hotelId()) {
        <h3 class="rounded-md bg-[#FFF8D6] p-2 text-sm text-[#E76500]">ID: {{ hotelId() }}</h3>
    }
    @if (uploading()) {
        <p class="text-sm text-[#5B738B]" role="status">Uploading image...</p>
    }

</div>
