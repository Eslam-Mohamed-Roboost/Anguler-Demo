<div class="fixed inset-0 bg-black/30 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl shadow-xl max-w-md w-full flex flex-col max-h-[90vh]">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-primary">
          <span class="text-lg font-bold">%</span>
        </div>
        <h2 class="text-xl font-bold text-gray-900">Hotels Commissions</h2>
      </div>
      <button
        type="button"
        (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 transition"
        aria-label="Close"
      >
        <app-icon name="x-circle" size="md" />
      </button>
    </div>

    <!-- Content -->
    <div class="px-6 py-5 overflow-y-auto flex-1">
      <!-- Info Banner -->
      <div class="flex gap-3 p-4 rounded-lg bg-blue-50 border border-blue-200 mb-6">
        <app-icon name="info" size="sm" class="text-blue-600 shrink-0 mt-0.5" />
        <p class="text-sm text-blue-700 leading-relaxed">
          Any update to the hotel commission will be reflected in their accounts effective from 12:00 AM of the update day.
        </p>
      </div>

      <!-- Form -->
      <form class="space-y-5">
        <!-- Commission Input -->
        <div>
          <label for="commission" class="block text-sm font-medium text-gray-700 mb-2">
            General Commission (%)
          </label>
          <div class="relative">
            <input
              id="commission"
              type="number"
              min="0"
              max="100"
              step="0.1"
              [value]="commission()"
              (change)="onCommissionChange($event)"
              [disabled]="loading() || saving()"
              class="w-full px-4 py-3 rounded-lg border border-gray-300 text-gray-900 placeholder-gray-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 disabled:bg-gray-50 disabled:text-gray-500 disabled:cursor-not-allowed transition"
              placeholder="Enter commission percentage"
              aria-label="Commission percentage"
            />
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
              %
            </span>
          </div>
          <p class="text-xs text-gray-500 mt-1.5">
            Commission value: <span class="font-semibold text-gray-700">{{ commission() }}%</span>
          </p>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="px-6 py-5 border-t border-gray-200 flex gap-3 flex-shrink-0 bg-white">
   
      <button
        type="button"
        (click)="saveChanges()"
        [disabled]="loading() || saving()"
        class="flex-1 px-4 py-3.5 rounded-lg bg-green-600 text-white font-bold text-base hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition"
      >
        @if (loading()) {
          Loading...
        } @else if (saving()) {
          {{ 'common.saving' | translate }}
        } @else {
          Save Changes
        }
      </button>
    </div>
  </div>
</div>
