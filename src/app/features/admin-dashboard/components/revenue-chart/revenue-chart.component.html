<div class="rounded-xl border border-gray-100 bg-white p-5">
  <!-- Header -->
  <div class="mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-orange-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1" />
        </svg>
      </span>
      <span class="text-sm font-semibold text-gray-800">Revenues</span>
    </div>

    <div class="flex items-center gap-2">
      <!-- Metric Dropdown -->
      <div class="relative">
        <button
          type="button"
          class="flex items-center gap-1 rounded-md border border-gray-200 px-3 py-1.5 text-xs font-medium text-gray-600 transition-colors hover:bg-gray-50"
          (click)="toggleMetricOpen()"
        >
          {{ selectedMetric() }}
          <svg class="size-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        @if (metricOpen()) {
          <div class="absolute end-0 top-full z-10 mt-1 min-w-[140px] rounded-md border border-gray-100 bg-white py-1 shadow-lg">
            @for (metric of metrics; track metric) {
              <button
                type="button"
                class="w-full px-3 py-1.5 text-start text-xs text-gray-600 transition-colors hover:bg-gray-50"
                [class.font-semibold]="metric === selectedMetric()"
                [class.text-emerald-600]="metric === selectedMetric()"
                (click)="selectMetric(metric)"
              >
                {{ metric }}
              </button>
            }
          </div>
        }
      </div>

      <!-- Period Dropdown -->
      <div class="relative">
        <button
          type="button"
          class="flex items-center gap-1 rounded-md border border-gray-200 px-3 py-1.5 text-xs font-medium text-gray-600 transition-colors hover:bg-gray-50"
          (click)="togglePeriodOpen()"
        >
          {{ selectedPeriod() }}
          <svg class="size-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        @if (periodOpen()) {
          <div class="absolute end-0 top-full z-10 mt-1 min-w-[100px] rounded-md border border-gray-100 bg-white py-1 shadow-lg">
            @for (period of periods; track period) {
              <button
                type="button"
                class="w-full px-3 py-1.5 text-start text-xs text-gray-600 transition-colors hover:bg-gray-50"
                [class.font-semibold]="period === selectedPeriod()"
                [class.text-emerald-600]="period === selectedPeriod()"
                (click)="selectPeriod(period)"
              >
                {{ period }}
              </button>
            }
          </div>
        }
      </div>
    </div>
  </div>

  <!-- Chart -->
  <highcharts-chart
    [options]="chartOptions()"
    class="block w-full"
  />
</div>
