<div class="rounded-xl border border-gray-100 bg-white p-5">
  <!-- Header -->
  <div class="mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-red-500">
        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z" />
        </svg>
      </span>
      <span class="text-sm font-semibold text-gray-800">Important Alerts</span>
    </div>
    <a class="text-xs font-medium text-red-500 transition-colors hover:text-red-600" href="#">
      All Alerts &rarr;
    </a>
  </div>

  <!-- Alert List -->
  <div class="space-y-4">
    @for (alert of alerts(); track $index) {
      <div class="rounded-lg border border-gray-50 p-3">
        <!-- Header: Avatar, Name, Role -->
        <div class="mb-2 flex items-center gap-2.5">
          <span
            class="inline-flex size-8 shrink-0 items-center justify-center rounded-full text-xs font-semibold text-white"
            [style.background-color]="alert.avatarColor"
          >
            {{ getInitials(alert.name) }}
          </span>
          <span class="text-sm font-semibold text-gray-800">{{ alert.name }}</span>
          <span class="rounded-md px-2 py-0.5 text-[10px] font-semibold" [class]="roleBadgeClass(alert.role)">
            {{ alert.role }}
          </span>
        </div>

        <!-- Message -->
        <p class="mb-2 text-xs leading-relaxed text-gray-500">{{ alert.message }}</p>

        <!-- Time -->
        <div class="flex justify-end">
          <span class="text-[11px] text-gray-400">{{ alert.timeAgo }}</span>
        </div>
      </div>
    }
  </div>
</div>
